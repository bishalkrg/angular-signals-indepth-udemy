@for(course of coursesList(); track course.id){
<div class="course-card">
    <div class="course-header">
        <span class="course-title">{{course.title}}</span>
    </div>
    <div>
        <img class="course-image" src="{{course.iconUrl}}">
    </div>
    <div class="course-description">
        {{course.longDescription}}
    </div>
    <div class="course-actions">
        <button class="btn">View Course</button>
        <button class="btn" (click)="openEditCourseDialog(course)">Edit</button>
        <img class="delete" src="/assets/icons/delete.svg" (click)="deleteCourse(course)">
    </div>
</div>
}
